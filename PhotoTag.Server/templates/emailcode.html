<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PhotoTag Verification</title>
  <style>
    html { height:100%; }
    body { margin:0; padding:0; height:100vh; overflow:hidden; }
    img { border:0; display:block; }
    a { color:inherit; text-decoration:none; }

    .bg {
      background-color: black;
      background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://ptdx.tobikcze.eu/images/background.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center bottom;
      color: #ffffff;
    }

    .container { width:600px; margin:0 auto; }
    .content { width:100%; }
    .top { text-align:center; padding-top:0; }
    .bottom { color:#ffffff; text-align:center; padding:40px 20px; }
    .welcome { font-family: Arial, Helvetica, sans-serif; font-size:20px; line-height:1.3; margin:0 0 12px 0; }
    .code { font-family: 'Courier New', Courier, monospace; font-size:60px; font-weight:900; letter-spacing:2px; margin:0; }

    @media only screen and (max-width:600px) {
      .bg { background-position: center center !important; }
      .container { width:100% !important; }
      .logo { width:360px !important; height:auto !important; }
      .code { font-size:50px !important; }
    }
  </style>
</head>
<body class="bg" style="margin:0; padding:0;">

  <!--[if mso]>
  <v:background xmlns:v="urn:schemas-microsoft-com:vml" fill="t">
    <v:fill type="frame" src="https://ptdx.tobikcze.eu/images/background.jpg" color="#000000"/>
  </v:background>
  <![endif]-->

  <table role="presentation" width="100%" height="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;height:100%;">
    <tr>
      <td align="center" valign="middle" style="height:100%;width:100%;">
        <table role="presentation" class="container" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:100%;">
          <tr>
            <td class="content">

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td class="top">
                    <img src="https://ptdx.tobikcze.eu/images/logo_app.png" alt="PhotoTag" width="450" class="logo" style="display:block;margin:0 auto;">
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td height="30">&nbsp;</td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td class="bottom">
                    <p class="welcome" style="margin:0;color:#ffffff;">Welcome {{USERNAME}},</p>
                    <p class="welcome" style="margin:8px 0 20px 0;color:#ffffff;">use the code below to verify your email address</p>
                    <p class="code" style="margin:0;color:#ffffff;">{{CODE}}</p>
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td height="180">&nbsp;</td>
                </tr>
              </table>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
